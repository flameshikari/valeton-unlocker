name: Build binaries

on:
  push:
    branches: [master]
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm test && npm run build

  binaries:
    name: Binary [${{ matrix.os }}/${{ matrix.arch }}]
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run build:go

      - name: Test Go server
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: cd server && go test ./... && go vet ./...

      - name: Install verified UPX
        if: matrix.os != 'darwin'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/upx.tar.xz" \
            https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-amd64_linux.tar.xz
          echo "79cea8a50b6fa102d10c7b79a419cd77dead3cc2d78661de2dc5e5815dc505c1  $RUNNER_TEMP/upx.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/upx.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/upx-5.3.0-amd64_linux" >> "$GITHUB_PATH"

      - name: Compress binary with UPX
        if: matrix.os != 'darwin'
        run: |
          binary=bin/valeton-unlocker
          if [ '${{ matrix.os }}' = windows ]; then
            binary="$binary.exe"
            upx --best --lzma --compress-icons=0 --compress-resources=0 "$binary"
          else
            upx --best --lzma "$binary"
          fi
          upx --test "$binary"

      - name: Check executable
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: ./bin/valeton-unlocker -version

      - name: Archive binary
        run: |
          name="valeton-unlocker-${{ matrix.os }}-${{ matrix.arch }}"
          cp LICENSE NOTICE bin/
          if [ '${{ matrix.os }}' = windows ]; then
            zip -j "$name.zip" bin/valeton-unlocker.exe bin/LICENSE bin/NOTICE
          else
            tar czf "$name.tar.gz" -C bin valeton-unlocker LICENSE NOTICE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: valeton-unlocker-${{ matrix.os }}-${{ matrix.arch }}
          path: valeton-unlocker-${{ matrix.os }}-${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/release
          pattern: valeton-unlocker-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: ${{ runner.temp }}/release/*
          generate_release_notes: true
