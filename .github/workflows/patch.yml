name: Patch APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: URL of APK or ZIP w/ APK
        required: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download original APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          mkdir -p in out
          curl -fsSL --retry 3 --output in/download "$APK_URL"
          KIND=$(file -b in/download)
          echo "downloaded: $KIND"

          case "$KIND" in
              *"Android package"*|*"Java archive data (JAR)"*)
                  mv in/download in/original.apk
                  ;;
              *"Zip archive"*)
                  unzip -j -o in/download '*.apk' -d in
                  APK=$(find in -maxdepth 1 -name '*.apk' | head -1)
                  [[ -n "$APK" ]] || { echo "::error::no .apk inside the downloaded ZIP"; exit 1; }
                  mv "$APK" in/original.apk
                  ;;
              *)
                  echo "::error::downloaded file is neither an APK nor a ZIP ($KIND)"
                  exit 1
                  ;;
          esac

          file in/original.apk | grep -q 'Android package' \
              || { echo "::error::extracted file is not an APK"; exit 1; }

      - name: Apply patch
        run: |
          ARGS=(-i in/original.apk -o out/patched.apk)
          python3 tools/patch_apk.py "${ARGS[@]}"

      - name: Re-sign
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CUSTOM_VALUES=(
            "$APK_KEYSTORE_BASE64"
            "$APK_KEY_ALIAS"
            "$APK_KEYSTORE_PASSWORD"
          )
          CUSTOM_COUNT=0
          for VALUE in "${CUSTOM_VALUES[@]}"; do
            [[ -n "$VALUE" ]] && CUSTOM_COUNT=$((CUSTOM_COUNT + 1))
          done

          CUSTOM_REQUESTED="$CUSTOM_COUNT"
          [[ -n "$APK_KEY_PASSWORD" ]] && CUSTOM_REQUESTED=$((CUSTOM_REQUESTED + 1))
          if [[ "$CUSTOM_REQUESTED" -ne 0 && "$CUSTOM_COUNT" -ne 3 ]]; then
            echo "::error::custom signing requires APK_KEYSTORE_BASE64, APK_KEY_ALIAS, and APK_KEYSTORE_PASSWORD"
            exit 1
          fi

          if [[ "$CUSTOM_COUNT" -eq 3 ]]; then
            KEYSTORE_PATH="in/custom-signing.keystore"
            trap 'rm -f "$KEYSTORE_PATH"' EXIT
            printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            KEYSTORE="$KEYSTORE_PATH" \
            KEY_ALIAS="$APK_KEY_ALIAS" \
            KEY_PASS="$APK_KEYSTORE_PASSWORD" \
            KEY_KEY_PASS="${APK_KEY_PASSWORD:-$APK_KEYSTORE_PASSWORD}" \
              ./tools/sign_apk.sh out/patched.apk
          else
            ./tools/sign_apk.sh out/patched.apk
          fi

      - name: Compute SHA-256
        run: |
          cd out
          sha256sum patched-signed.apk | tee patched-signed.apk.sha256

      - name: Upload patched APK
        uses: actions/upload-artifact@v7
        with:
          name: valeton-suite-patched
          path: |
            out/patched-signed.apk
            out/patched-signed.apk.sha256
          retention-days: 14
          if-no-files-found: error
