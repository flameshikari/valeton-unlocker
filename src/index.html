<main>
  <div id="stage" class="stage empty" data-icon="arrow">
    <div class="placeholder" aria-hidden="true">
      <svg class="icon icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20V4M6 10l6-6 6 6"/>
      </svg>
      <svg class="icon icon-cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
      <svg class="icon icon-usb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20V5m0 11-5-4V9m5 4 5-4V7"/>
        <path d="m12 2-3 4h6z" fill="currentColor" stroke="none"/>
        <circle cx="7" cy="8" r="1.5" fill="currentColor" stroke="none"/>
        <rect x="15.5" y="4.5" width="3" height="3" rx=".4" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="21" r="1.5" fill="currentColor" stroke="none"/>
      </svg>
      <svg class="icon icon-ble" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m7 7 10 10-5 4V3l5 4L7 17"/>
      </svg>
      <span class="icon icon-loading"><span class="spinner-ring"></span></span>
    </div>
  </div>

  <div class="title">
    <div class="model-row">
      <a id="github" class="github" href="https://github.com/flameshikari/valeton-unlocker" target="_blank" rel="noopener noreferrer" aria-label="Open Valeton Unlocker on GitHub" title="GitHub" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.64 22.41c.58.11.79-.25.79-.56v-2.23c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.47.11-3.05 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.75 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.42-2.71 5.39-5.29 5.68.42.36.79 1.06.79 2.14v3.17c0 .31.21.68.8.56A11.5 11.5 0 0 0 12 .7Z"/></svg>
      </a>
      <h1 class="model"><a id="projectTitle" class="project-title" href="https://github.com/flameshikari/valeton-unlocker" target="_blank" rel="noopener noreferrer" aria-label="Open Valeton Unlocker on GitHub">Valeton <span id="modelName" class="word" data-key="Unlocker">Unlocker</span></a></h1>
      <button id="disconnect" class="disconnect" type="button" aria-label="Disconnect pedal" title="Disconnect" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <div id="meta" class="meta swap" role="status" data-key="meta swap|Connect the pedal over USB or Bluetooth">Connect the pedal over USB or Bluetooth</div>
  </div>

  <select id="port" hidden aria-label="MIDI port"></select>

  <div class="controls">
    <div id="connections" class="connections off" role="group" aria-label="Connection method">
      <button id="connect" class="connect" aria-label="Connect over USB" title="USB MIDI">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20V5m0 11-5-4V9m5 4 5-4V7"/>
          <path d="m12 2-3 4h6z" fill="currentColor" stroke="none"/>
          <circle cx="7" cy="8" r="1.5" fill="currentColor" stroke="none"/>
          <rect x="15.5" y="4.5" width="3" height="3" rx=".4" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="21" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button id="connectBle" class="connect" aria-label="Connect over Bluetooth" title="Bluetooth LE MIDI">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m7 7 10 10-5 4V3l5 4L7 17"/>
        </svg>
      </button>
    </div>
    <div id="seg" class="seg off" role="group" aria-label="Language">
      <button class="opt" data-lang="en" aria-label="English" title="English" disabled><svg class="flag" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="uk-t"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg></button>
      <button class="opt" data-lang="zh" aria-label="Chinese" title="Chinese" disabled><svg class="flag" viewBox="0 0 30 20" preserveAspectRatio="xMinYMin slice" aria-hidden="true"><defs><path id="cn-s" d="M0,-1 0.587785,0.809017 -0.951057,-0.309017H0.951057L-0.587785,0.809017z" fill="#FFDE00"/></defs><rect width="30" height="20" fill="#EE1C25"/><use href="#cn-s" transform="translate(5,5) scale(3)"/><use href="#cn-s" transform="translate(10,2) rotate(23.036243)"/><use href="#cn-s" transform="translate(12,4) rotate(45.869898)"/><use href="#cn-s" transform="translate(12,7) rotate(69.945396)"/><use href="#cn-s" transform="translate(10,9) rotate(20.659808)"/></svg></button>
      <button id="apply" class="go" aria-label="Apply" title="Apply" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

</main>
